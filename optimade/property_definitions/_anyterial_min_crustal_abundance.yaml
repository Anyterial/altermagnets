$$schema: https://schemas.optimade.org/meta/v1.2/optimade/property_definition.json
$id: https://anyterial.se/optimade/defs/properties/_anyterial_min_crustal_abundance
title: Minimum crustal abundance
x-optimade-type: float
x-optimade-definition:
  kind: property
  version: 1.2.0
  format: '1.2'
  name: _anyterial_min_crustal_abundance
  label: _anyterial_min_crustal_abundance_structures
x-optimade-unit: ppm
x-optimade-unit-definitions:
- symbol: ppm
  title: parts per million
  description: Parts per million, a dimensionless ratio of one part in one million.
  standard:
    kind: gnu units
    version: '3.15'
    symbol: ppm
type:
- number
- 'null'
description: |-
  The minimum crustal abundance among the constituent elements of the material, given in parts per million by mass.

  The value is taken from the altermagnetic screening (the MinAbundPpm column) and reflects the scarcest element in the composition.
  A null value means the quantity is not available for this material.
