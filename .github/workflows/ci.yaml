name: Combined application CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install combined application dependencies
        run: python -m pip install -e ".[dev,optimade]"

      - name: Test the mounted OPTIMADE application
        run: python -m pytest -q tests/test_serve_combined.py tests/test_serve_optimade.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install browser test dependencies
        # Requires the next httk-serve release; do not change the project floor before then.
        run: python -m pip install -e ".[dev,optimade,browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser gate
        run: make test-browser
        env:
          ALTERMAGNETS_BROWSER_REQUIRED: "1"
