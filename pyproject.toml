[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "example_website_httk"
version = "0.1.0"
description = "Example of how to use httk as a static site generator (that can be extended with a backend)."
readme = "README.md"
license = "AGPL-3.0+"
requires-python = ">=3.11"
authors = [{ name = "Rickard Armiento", email = "gitcommits@armiento.net" }]
dependencies = [
  "duckdb>=1.1",
  "httk-web @ git+https://github.com/httk/httk-web@develop",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy"
]
detail-generation = [
  "matplotlib",
  "pymatgen",
  "ase",
]
optimade = [
  "httk-core>=2.0,<3",
  "httk-io>=0.1,<1",
  "httk-atomistic>=0.3,<1",
  "httk-data>=0.1,<1",
  "httk-optimade>=0.2,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
extend_skip_glob = ["src/data/**"]

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = ["src/data"]
force-exclude = true

[tool.black]
target-version = ["py311"]
line-length = 120
skip-string-normalization = true
force-exclude = '''
/src/data/
'''

[tool.pyright]
pythonVersion = "3.11"
include = ["src/functions", "serve_dynamic.py", "serve_optimade.py", "publish_static.py", "optimade/render_definitions.py"]
exclude = ["src/data"]
extraPaths = ["src"]
reportMissingImports = true

[tool.mypy]
python_version = "3.11"
files = ["src/functions", "serve_dynamic.py", "serve_optimade.py", "publish_static.py", "optimade/render_definitions.py"]
mypy_path = ["src", "src/functions"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
exclude = ['^src/data/']

[[tool.mypy.overrides]]
 module = ["yaml", "markdown", "docutils", "docutils.*", "duckdb", "httk.web", "httk.web.*"]
ignore_missing_imports = true

# The httk v2 capability modules are Python 3.12 (PEP 695) source and are not
# installed into the 3.11-targeted type-check environment; skip following them so
# mypy neither parses their newer syntax nor demands stubs. They resolve at
# runtime via the workspace PYTHONPATH (or the `optimade` extra when installed).
[[tool.mypy.overrides]]
module = ["httk", "httk.*"]
follow_imports = "skip"
ignore_missing_imports = true
