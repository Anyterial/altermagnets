$$schema: https://schemas.optimade.org/meta/v1.2/optimade/property_definition.json
$id: https://anyterial.se/optimade/defs/properties/_anyt_magnetic_space_group_bns
title: Magnetic space group (BNS)
x-optimade-type: string
x-optimade-definition:
  kind: property
  version: 1.2.0
  format: '1.2'
  name: _anyt_magnetic_space_group_bns
  label: _anyt_magnetic_space_group_bns_structures
x-optimade-unit: inapplicable
type:
- string
- 'null'
description: |-
  The magnetic space group of the material in Belov-Neronova-Smirnova (BNS) notation.

  The value combines the BNS Hermann-Mauguin symbol with its BNS number in parentheses, for example `Pn'm'a (62.446)`.
  It is derived from the BNS column of the symmetry-summary tables by stripping the LaTeX markup used there; primes on symmetry elements are rendered as apostrophes and an overbar is rendered as a leading minus sign.
  A null value means no linked symmetry entry provides a BNS symbol for this material.
examples:
- Pn'm'a (62.446)
- R-3c' (167.107)
