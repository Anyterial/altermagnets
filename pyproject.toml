[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "example_website_httk"
version = "0.1.0"
description = "Example of how to use httk as a static site generator (that can be extended with a backend)."
readme = "README.md"
license = "AGPL-3.0+"
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "gitcommits@armiento.net" }]
dependencies = [
  "httk-store[duckdb]>=0.2,<1",
  "httk-serve>=0.2,<1",
  "httk-io>=0.1,<1",
  "httk-atomistic>=0.3,<1",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.16,<0.17",
  "pyright",
  "mypy"
]
browser = [
  "playwright",
]
detail-generation = [
  "matplotlib",
  "pymatgen",
  "ase",
]
optimade = [
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = [
  "browser: end-to-end browser tests requiring Playwright and Chromium",
]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 120
extend-exclude = ["src/data"]
force-exclude = true

[tool.ruff.lint]
# TRY002: raising plain Exception is accepted httk style.
# TRY004: the ValueError/TypeError choice is public API; do not churn it.
# BLE001: broad excepts deliberately isolate loader/page failures.
ignore = ["TRY002", "TRY004", "BLE001"]

[tool.ruff.format]
# preserve replaces black's skip-string-normalization: existing quote styles are kept.
quote-style = "preserve"

[tool.pyright]
pythonVersion = "3.12"
include = ["src/functions", "src/widgets", "workflows", "tools/build_store.py", "optimade", "serve_combined.py", "serve_optimade.py", "publish_static.py"]
exclude = ["src/data"]
extraPaths = ["src", "src/functions", "src/widgets"]
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src/functions", "src/widgets", "workflows", "tools/build_store.py", "optimade", "serve_combined.py", "serve_optimade.py", "publish_static.py"]
mypy_path = ["src", "src/functions", "src/widgets"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
exclude = ['^src/data/']

[[tool.mypy.overrides]]
 module = ["yaml", "markdown", "docutils", "docutils.*"]
ignore_missing_imports = true
