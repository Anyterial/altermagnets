$$schema: https://schemas.optimade.org/meta/v1.2/optimade/property_definition.json
$id: https://anyterial.se/optimade/defs/properties/_anyterial_magndata_ids
title: MAGNDATA identifiers
x-optimade-type: list
x-optimade-definition:
  kind: property
  version: 1.2.0
  format: '1.2'
  name: _anyterial_magndata_ids
  label: _anyterial_magndata_ids_structures
x-optimade-unit: inapplicable
type:
- array
- 'null'
items:
  x-optimade-type: string
  x-optimade-unit: inapplicable
  type:
  - string
description: |-
  The identifiers of the MAGNDATA magnetic-structure entries linked to this material.

  Each item is an opaque MAGNDATA identifier string (for example `0.379`) as used by the MAGNDATA database at the Bilbao Crystallographic Server.
  A null value means no MAGNDATA identifiers are recorded for this material; an empty list is not used.
examples:
- ['0.379']
- ['0.296', '0.295']
